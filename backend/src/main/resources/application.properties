spring.application.name=employee-feedback-analyzer
server.port=${SERVER_PORT:8080}

# Database Configuration (SQLite)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./feedback_agent.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & Secrets
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000
app.security.hr-registration-code=${HR_REGISTRATION_CODE:HR_SECRET_ACCESS_2025}

# AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.5-flash
