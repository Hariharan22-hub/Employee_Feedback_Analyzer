version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-feedback-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=jdbc:sqlite:/app/data/feedback_agent.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HR_REGISTRATION_CODE=${HR_REGISTRATION_CODE:-HR_SECRET_ACCESS_2025}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    volumes:
      - feedback_data:/app/data
    restart: unless-stopped

volumes:
  feedback_data:
